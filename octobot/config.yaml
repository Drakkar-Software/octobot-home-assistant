# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: OctoBot
version: "1.0.0"
slug: octobot
description: OctoBot crypto trading bot (stable) with Node web interface
url: "https://github.com/drakkar-software/octobot-home-assistant/tree/main/octobot"
arch:
  - aarch64
  - amd64
init: false
ports:
  8000/tcp: 8000
  # 5001/tcp: 5001   # fallback: classic web dashboard, uncomment if node /app 404s
ports_description:
  8000/tcp: "OctoBot Node web interface"
webui: "http://[HOST]:[PORT:8000/tcp]/app"
options:
  enable_node_api: true
schema:
  enable_node_api: bool
image: "ghcr.io/drakkar-software/{arch}-addon-octobot"
#   ^ CI (build-app.yaml) reads this to know where to publish; required, not optional.
#     Comment out locally only if you want the Supervisor to build from the
#     Dockerfile instead of pulling — but keep it set on main or CI publish breaks.
